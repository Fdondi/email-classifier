spring:
  datasource:
    url: jdbc:sqlite:./target/test-email-tool.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-init-sql: PRAGMA journal_mode=WAL;
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

app:
  data-dir: ./target
  config-dir: ../config
  mail:
    source: maildir
    maildir: ../testdata/eml
  llm:
    base-url: http://127.0.0.1:1
    model: test-model
    timeout-seconds: 2
  schedule-enabled: false
  cors-origins: http://localhost:4200
