@if (emails.length === 0) {
  <p class="muted">{{ emptyText }}</p>
} @else {
  <ul class="email-list">
    @for (email of emails; track email.id) {
      <li class="email-item">
        <a class="email-row" [routerLink]="['/email', email.id]">
          <span class="email-line1">
            <span class="email-subject">{{ email.subject }}</span>
            <span class="email-meta">{{ email.fromDisplayName || email.fromAddress }}</span>
            @if (email.dueDate) {
              <span class="email-due">due {{ email.dueDate }}</span>
            }
          </span>
          <span class="email-line2">
            <span class="email-summary">{{ email.summary }}</span>
            <span class="email-meta">{{ email.dateSent | date: 'medium' }}</span>
          </span>
        </a>
        <select
          class="category-select"
          [disabled]="busyId === email.id"
          (change)="reassign(email, $event)"
          [attr.aria-label]="'Category for ' + (email.subject || 'email')">
          @if (!email.category) {
            <option value="" disabled selected>Unclassified</option>
          }
          @for (category of categories; track category) {
            <option [value]="category" [selected]="email.category === category">{{ label(category) }}</option>
          }
        </select>
      </li>
    }
  </ul>
}
